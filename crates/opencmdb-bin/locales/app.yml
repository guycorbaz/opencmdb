# ── IPAM (story 14.2 — the addressing plan, fed by the store) ────────────────
# 🔴 THE FOUR POLICY WORDS ARE BINDING (PR #166, 2026-09-11, `prd.md` and the UX spec). No story
# may extend them, and no story may translate them twice. The four `ipam.policy.*` keys below ARE
# that table's UI column, and `IpPolicy::as_str` is its code column; a test compares the two.
# ⚠️ `structural` was retired here: `.0` and `.255` are simply `infrastructure`, which the binding
# table already defines as including the network and broadcast addresses. They therefore render
# with the POLICY key and not with a state key of their own — one concept, one word.
ipam.title:
  en: "IPAM"
  fr: "IPAM"
ipam.lede:
  en: "The addressing plan you declared. One cell, one address."
  fr: "Le plan d'adressage que vous avez déclaré. Une case, une adresse."
ipam.selector_label:
  en: "Subnet"
  fr: "Sous-réseau"
ipam.grid_label:
  en: "Addressing plan grid"
  fr: "Grille du plan d'adressage"
ipam.policy.static:
  en: "static"
  fr: "statique"
ipam.policy.dhcp_pool:
  en: "dhcp-pool"
  fr: "pool DHCP"
ipam.policy.reserved:
  en: "reserved"
  fr: "réservé"
ipam.policy.infrastructure:
  en: "infrastructure"
  fr: "infrastructure"
ipam.state.defined:
  en: "defined"
  fr: "définie"
ipam.state.free:
  en: "free"
  fr: "libre"
# ⚠️ NOT COVERED HAS NO LEGEND ENTRY, by Guy's arbitration of 2026-09-11: a story may not extend the
# binding vocabulary, and *not covered* is not one of its four words. The key exists because every
# cell owes an `aria-label` — a cell that says nothing to a screen reader is worse than one that
# says the plan is silent about it.
ipam.state.not_covered:
  en: "not covered by the plan"
  fr: "hors du plan"
ipam.cell_label:
  en: "%{address} · %{state}"
  fr: "%{address} · %{state}"
ipam.cell_label_in_policy:
  en: "%{address} · %{state}, %{policy}"
  fr: "%{address} · %{state}, %{policy}"
# 🔑 A LIST AND NEVER A RATIO. A percentage invites a reader to compare two subnets whose sizes
# differ, and the occupancy of a plan is not a rate; it is also why `ipam/` needs no float.
ipam.occupancy:
  en: "%{defined} defined · %{free} free to assign · %{infrastructure} infrastructure · %{not_covered} not covered"
  fr: "%{defined} définies · %{free} libres à attribuer · %{infrastructure} infrastructure · %{not_covered} hors du plan"
ipam.next_free:
  en: "Next address the plan can offer"
  fr: "Prochaine adresse que le plan peut offrir"
# ⚠️ It says THE PLAN and not *the network*: until story 14.3 excludes every observed address, this
# panel answers what the plan allows and not what is actually free out there. Naming the source is
# what stops the sentence being read as a promise it cannot keep.
# 🔴 TWO SENTENCES, and the code review is what separated them: the one below was VACUOUS over a
# subnet no static range reaches — it announced an exhausted offer where nothing was ever offered —
# and FALSE when an overlapping `reserved` range is what emptied a static one, which it did not name.
ipam.next_free_none:
  en: "None — nothing a static range holds here can be offered: each address is defined, documented, already seen on the network, an edge, or covered by a more protective range"
  fr: "Aucune — rien de ce qu'une plage statique contient ici ne peut être proposé : chaque adresse est définie, documentée, déjà vue sur le réseau, une bordure, ou couverte par une plage plus protectrice"
ipam.next_free_no_static:
  en: "None — no static range reaches this subnet, and the offer draws from static ranges only"
  fr: "Aucune — aucune plage statique n'atteint ce sous-réseau, et l'offre ne puise que dans les plages statiques"
ipam.next_free_caveat:
  en: "Only from static ranges, and never an address the network has been seen on or a documented one."
  fr: "Uniquement dans les plages statiques, et jamais une adresse vue sur le réseau ni une adresse documentée."
ipam.cell_label_seen:
  en: "%{label} · seen: %{sightings}"
  fr: "%{label} · vue : %{sightings}"
ipam.findings.heading:
  en: "What the network shows"
  fr: "Ce que montre le réseau"
# 🔴 Story 14.6: the sentence that REPLACES the all-clear for a subnet the product cannot observe.
# `ipam.findings.none` would assert concordance about a plan the only connector never looks at; this
# says what is true — nothing was checked — and it names THIS SUBNET, because the plan-wide *outside*
# list keeps rendering beside it and the two must not contradict each other in one viewport.
# The *no offer* line for an unobservable subnet: the shipped one names the SIZE, which is a true
# sentence about the wrong reason for an IPv6 subnet of any prefix length.
ipam.unobservable.heading:
  en: "No grid is drawn for an IPv6 subnet: the product cannot observe IPv6, so a grid would show what you declared and nothing about the network. The ranges you declared are below."
  fr: "Aucune grille n'est dessinée pour un sous-réseau IPv6 : le produit n'observe pas IPv6, donc une grille montrerait ce que vous avez déclaré et rien du réseau. Les plages que vous avez déclarées figurent ci-dessous."
ipam.unobservable.no_offer:
  en: "No address is offered here: the product cannot see what is in use on an IPv6 network."
  fr: "Aucune adresse n'est proposée ici : le produit ne voit pas ce qui est utilisé sur un réseau IPv6."
ipam.audit.unobservable:
  en: "Nothing here was checked: the scanner does not reach IPv6, so the product has no observation to compare this subnet's plan against. What it shows below is what you declared."
  fr: "Rien ici n'a été vérifié : le scanner n'atteint pas IPv6, donc le produit n'a aucune observation à comparer au plan de ce sous-réseau. Ce qui suit est ce que vous avez déclaré."
ipam.findings.none:
  en: "Nothing the network has shown contradicts this subnet's plan."
  fr: "Rien de ce que le réseau a montré ne contredit le plan de ce sous-réseau."
ipam.finding.seen_mac:
  en: "hardware address %{mac}, last seen %{at}"
  fr: "adresse matérielle %{mac}, vue pour la dernière fois le %{at}"
ipam.finding.seen_no_mac:
  en: "no hardware address, last seen %{at}"
  fr: "sans adresse matérielle, vue pour la dernière fois le %{at}"
# 🔴 ONE SENTENCE PER COUNT, NEVER `(s)`. Story 6b.10's review found `1 field(s)` on `/triage` and
# fixed it as a CLASS with a property over this whole file; a new parenthetical plural here would
# reopen it. A cell's name carries the three most recent hardware addresses and then says how many
# it is not showing — the findings list below the grid keeps every one of them.
ipam.finding.more_one:
  en: "and %{count} other hardware address"
  fr: "et %{count} autre adresse matérielle"
ipam.finding.more_many:
  en: "and %{count} other hardware addresses"
  fr: "et %{count} autres adresses matérielles"
ipam.finding.conflict:
  en: "Address conflict"
  fr: "Conflit d'adresse"
ipam.finding.conflict_note:
  en: "Two hardware addresses were seen on this address. A replaced card and a duplicate look the same from here."
  fr: "Deux adresses matérielles ont été vues sur cette adresse. Une carte remplacée et un doublon se ressemblent vus d'ici."
ipam.finding.triage_link:
  en: "Open its question in triage"
  fr: "Ouvrir sa question dans le tri"
ipam.finding.documented:
  en: "Documented in the inventory, so triage asks nothing about it"
  fr: "Documentée dans l'inventaire, le tri ne pose donc aucune question à son sujet"
ipam.outside.heading:
  en: "Seen outside every subnet of the plan"
  fr: "Vues hors de tout sous-réseau du plan"
# Decision 11 says *short*, and the code review measured 5 000 addresses there on one page. The list
# shows the twenty most recently seen and SAYS how many it is not showing — a bound that hides its
# own existence would let the screen claim the network showed only what it had room for.
ipam.outside.more_one:
  en: "and %{count} other address seen outside the plan"
  fr: "et %{count} autre adresse vue hors du plan"
ipam.outside.more_many:
  en: "and %{count} other addresses seen outside the plan"
  fr: "et %{count} autres adresses vues hors du plan"
ipam.pool_warning.heading:
  en: "Defined inside a DHCP pool"
  fr: "Définies dans un pool DHCP"
ipam.pool_warning.item:
  en: "%{address} is defined inside a dhcp-pool range: the pool may hand it to another machine."
  fr: "%{address} est définie dans une plage pool DHCP : le pool peut l'attribuer à une autre machine."
ipam.too_large_no_offer:
  en: "No address is offered for a subnet this size."
  fr: "Aucune adresse n'est proposée pour un sous-réseau de cette taille."
ipam.check.seen:
  en: "%{address} has been seen on the network: a machine may already be using it."
  fr: "%{address} a été vue sur le réseau : une machine l'utilise peut-être déjà."
ipam.check.documented:
  en: "%{address} is documented in the inventory."
  fr: "%{address} est documentée dans l'inventaire."
ipam.check.defined:
  en: "%{address} is already defined in the plan."
  fr: "%{address} est déjà définie dans le plan."
ipam.check.in_pool:
  en: "%{address} is inside a dhcp-pool range: the pool may hand it to another machine."
  fr: "%{address} est dans une plage pool DHCP : le pool peut l'attribuer à une autre machine."
ipam.check.still_writes:
  en: "You can still define it."
  fr: "Vous pouvez tout de même la définir."
# 🔴 THE ANSWER WHEN THERE IS NO ANSWER. A check that refused with a status left htmx holding the
# PREVIOUS address's warning under a new value — a sentence about an address the operator is no
# longer writing — and a render failure put a whole error page inside a live region.
ipam.check.unavailable:
  en: "The plan could not be checked just now. The write does not depend on this check."
  fr: "La vérification du plan n'a pas abouti. L'écriture ne dépend pas de cette vérification."
# The RANGE form's warning before the write (Guy, 2026-09-15). It names the count and refuses
# nothing: defining a static range over addresses already in use is ordinary when the operator is
# writing down what is already there.
ipam.check.range_seen_one:
  en: "%{count} address already seen on the network would fall inside this static range."
  fr: "%{count} adresse déjà vue sur le réseau tomberait dans cette plage statique."
ipam.check.range_seen_many:
  en: "%{count} addresses already seen on the network would fall inside this static range."
  fr: "%{count} adresses déjà vues sur le réseau tomberaient dans cette plage statique."
# 🔑 Story 14.4's delete warning (decision 3: a delete warns before it fires, for BOTH deletes). It
# REFUSES NOTHING — the address and range checks' own contract — and says what the removal would
# change: addresses the range explains today that become findings once it is gone, and whether the
# subnet is left with nothing on offer.
ipam.check.delete_range_seen_one:
  en: "%{count} address the network shows inside this range is explained by it today; remove the range and it becomes a finding."
  fr: "%{count} adresse vue sur le réseau dans cette plage est expliquée par elle aujourd'hui : supprimez la plage et elle devient un signalement."
ipam.check.delete_range_seen_many:
  en: "%{count} addresses the network shows inside this range are explained by it today; remove the range and they become findings."
  fr: "%{count} adresses vues sur le réseau dans cette plage sont expliquées par elle aujourd'hui : supprimez la plage et elles deviennent des signalements."
# 🔴 **THE REFUSAL THE RANGE DELETE ACTUALLY HAS, which the check never mentioned.** Story 14.4 mints
# `ipam.refusal.range_still_holds_addresses` — computed, not raised — and the warning consulted the
# NETWORK and the offer while never asking the one question that decides whether the gesture happens
# at all. The operator was told the removal was still possible over a press the adapter answers 409.
# 🔑 Worded like the subnet's, because it is the same shape: the refusal is coming, and saying so is
# kinder than letting them meet it blind.
ipam.check.delete_range_holds_one:
  en: "This range still holds 1 address you defined inside it, so removing it will be refused until that address is gone."
  fr: "Cette plage contient encore 1 adresse que vous y avez définie : sa suppression sera refusée tant qu'elle y sera."
ipam.check.delete_range_holds_many:
  en: "This range still holds %{count} addresses you defined inside it, so removing it will be refused until they are gone."
  fr: "Cette plage contient encore %{count} adresses que vous y avez définies : sa suppression sera refusée tant qu'elles y seront."
ipam.check.delete_empties_offer:
  en: "This is the only static range reaching this subnet, so removing it leaves nothing to offer here."
  fr: "C'est la seule plage statique qui couvre ce sous-réseau : la supprimer ne laissera plus rien à proposer ici."
ipam.check.delete_subnet_holds_one:
  en: "This subnet still holds %{count} record you defined, so removing it will be refused until that record is gone."
  fr: "Ce sous-réseau contient encore %{count} enregistrement que vous avez défini : sa suppression sera refusée tant qu'il sera là."
ipam.check.delete_subnet_holds_many:
  en: "This subnet still holds %{count} records you defined, so removing it will be refused until they are gone."
  fr: "Ce sous-réseau contient encore %{count} enregistrements que vous avez définis : sa suppression sera refusée tant qu'ils seront là."
ipam.check.delete_address_seen:
  en: "The network still shows this address in use. Removing its record does not free it — it leaves it as a finding."
  fr: "Le réseau montre encore cette adresse en usage. Supprimer son enregistrement ne la libère pas : elle devient un signalement."
ipam.check.still_removes:
  en: "The removal is still possible — this is what it would change, not a refusal."
  fr: "La suppression reste possible : ceci dit ce qu'elle changerait, ce n'est pas un refus."
ipam.unknown_subnet:
  en: "No subnet is named by this identifier. Choose one above."
  fr: "Aucun sous-réseau ne porte cet identifiant. Choisissez-en un ci-dessus."
# 🔴 A subnet larger than the ceiling is NOT drawn, and the sentence says what is shown instead.
# Measured before the ceiling existed: a `10.0.0.0/8` served 2.08 GB in 44 s with status 200, on the
# plain navigation link, because the default view is the numerically-lowest subnet.
ipam.too_large:
  en: "This subnet holds more than %{max} addresses, so its grid is not drawn. The ranges you declared are below."
  fr: "Ce sous-réseau contient plus de %{max} adresses, sa grille n'est donc pas dessinée. Les plages que vous avez déclarées figurent ci-dessous."
ipam.ranges_heading:
  en: "Declared ranges"
  fr: "Plages déclarées"
ipam.empty_plan:
  en: "No subnet is declared yet, so there is no plan to draw."
  fr: "Aucun sous-réseau n'est déclaré, il n'y a donc pas de plan à dessiner."

# ── The plan's write routes (story 14.2b) ────────────────────────────────────
# 🔑 EVERY REFUSAL NAMES THE RULE IT BROKE, in both locales. Story 6.4's finding is the reason: its
# success message shipped in ENGLISH under a French UI, with `field(s)` and a raw UUID in it,
# because the body was a Rust `format!` and not a key. ⚠️ These sentences are LOCAL and are not
# `document.*`'s: the DECISION to key a refusal is shared, the WORDING is not, and one body serving
# two surfaces is the shape story 6.4 paid for.
# 🔑 THE VERB IS « Définir » / *Define* AND NOT *Declare*: `prd.md:992` binds `declared`/« déclaré »
# to the operator-documented STATE, and the gesture axis carries no `declare` row — minting one
# would give one word two meanings, which is what that table exists to prevent. *Define* names the
# act without touching either axis.
# ⚠️ NO STORY NUMBER, on `gesture.*`'s own rule: a number turns a label into a calendar, therefore
# into a promise.
# 🔴 Since story 14.2b this label serves BOTH the empty plan's link and the summary of the form it
# links to. One act, one word: a door and the room behind it carrying different names is how an
# operator learns not to trust either.
ipam.empty_plan_gesture:
  en: "Define a subnet"
  fr: "Définir un sous-réseau"

# ── The plan's three forms (story 14.2b) ─────────────────────────────────────
# 🔑 THE SUMMARY OF THE SUBNET FORM REUSES `ipam.empty_plan_gesture`, and does not mint a second
# spelling of the same act: the empty plan names the gesture « Définir un sous-réseau » and the form
# that performs it must be called the same thing, or the door and the room carry different names.
ipam.form.heading:
  en: "Change the plan"
  fr: "Modifier le plan"
ipam.form.range_summary:
  en: "Define a range"
  fr: "Définir une plage"
ipam.form.address_summary:
  en: "Define an address"
  fr: "Définir une adresse"
# 🔴 THE EXAMPLE IS IN THE LABEL AND NOT IN A `placeholder`, and the guard is what forced it:
# `no_template_hard_codes_text_a_human_reads_from_an_attribute` reds on a hard-coded placeholder,
# correctly — it is text a human reads. Making it a key would have translated an IP address, which
# is not language; putting it in the label is better anyway, because a placeholder disappears the
# moment the operator types and is not an accessible name.
ipam.form.cidr:
  en: "Subnet, in CIDR notation — for example 192.0.2.0/24"
  fr: "Sous-réseau, en notation CIDR — par exemple 192.0.2.0/24"
ipam.form.label:
  en: "Label"
  fr: "Étiquette"
# Story 14.5 — the VLAN axis, minted in the binding vocabulary on 2026-09-21 (PR #192).
ipam.form.vlan:
  en: "VLAN (optional) — a number from 1 to 4094, or leave it empty"
  fr: "VLAN (facultatif) — un nombre de 1 à 4094, ou laissez vide"
ipam.vlan_tab:
  en: "VLAN %{vlan}"
  fr: "VLAN %{vlan}"
# 🔴 The two halves of Guy's decision of 2026-09-21, in ONE sentence: the plan carries the segment, and
# nothing else does. The second half is what stops an operator reading two tabs as two audits.
ipam.vlan_note:
  en: "The VLAN is what you declared: the scanner does not read tags. Nothing below this line uses it — the grid, the counts, the ranges, the findings and the offer are all computed across the whole plan — so two subnets sharing one address space show the same records and share one audit."
  fr: "Le VLAN est ce que vous avez déclaré : le scanner ne lit pas les étiquettes. Rien sous cette ligne ne s'en sert — la grille, les compteurs, les plages, les constats et l'offre se calculent sur tout le plan — si bien que deux sous-réseaux partageant un espace d'adressage montrent chacun les enregistrements de l'autre et partagent un audit."

ipam.form.first:
  en: "First address — for example 192.0.2.10"
  fr: "Première adresse — par exemple 192.0.2.10"
ipam.form.last:
  en: "Last address — for example 192.0.2.20"
  fr: "Dernière adresse — par exemple 192.0.2.20"
ipam.form.policy:
  en: "What it is meant for"
  fr: "Ce à quoi elle est destinée"
ipam.form.addr:
  en: "Address — for example 192.0.2.9"
  fr: "Adresse — par exemple 192.0.2.9"
ipam.form.submit:
  en: "Define"
  fr: "Définir"
# ⚠️ Shown where the range and address forms would be, when no subnet is in force. It says what to
# do rather than hiding the two forms, on Guy's premise (2) of 2026-08-13 — show and label rather
# than hide.
#
# 🔴 It said *"Choose a subnet above"* on the EMPTY plan too, where there is none to choose (story
# 14.2b's review). The sentence now holds in both cases the forms meet with no subnet in force.
#
# 🔴 And the second review found that fix still pointing "above" on the empty plan, where nothing is
# above, with an "it" that read back to the range. Two sentences, one per case.
ipam.form.needs_subnet:
  en: "A range or an address is defined inside a subnet: choose one above."
  fr: "Une plage ou une adresse se définit dans un sous-réseau : choisissez-en un ci-dessus."
ipam.form.needs_first_subnet:
  en: "A range or an address is defined inside a subnet: define a subnet first."
  fr: "Une plage ou une adresse se définit dans un sous-réseau : définissez d'abord un sous-réseau."
ipam.done.subnet:
  en: "Subnet defined. The plan now has somewhere to put ranges and addresses."
  fr: "Sous-réseau défini. Le plan a désormais où placer des plages et des adresses."
ipam.done.range:
  en: "Range defined. Its policy is what decides whether an address in it is a finding."
  fr: "Plage définie. Sa politique est ce qui décide si une adresse qui s'y trouve est un écart."
ipam.done.address:
  en: "Address defined."
  fr: "Adresse définie."
# 🔑 ONE SHAPE SENTENCE PER FORM, and not one for all three. `document.rs` gives a single body for
# every shape refusal because it has ONE field; these forms have two, five and three, and a sentence
# that named none of them would be the *"malformed request"* an operator cannot act on. ⚠️ The NIL
# UUID is folded in here rather than given a key of its own (`document.rs:195`'s precedent): it is a
# sentinel no operator types, so naming it would spend a sentence on a hand-crafted request.
# 🔑 Story 14.4's one DECIDED refusal: a range holds an address by arithmetic, so the database cannot
# raise it and the adapter counts it under the parent row's lock. The sentence names what the operator
# must do — remove or move those addresses — because a refusal they cannot act on is a dead end.
ipam.refusal.range_still_holds_addresses:
  en: "This range still holds addresses you defined inside it. Remove or move them first; deleting the range would leave them with nothing saying what that space is meant for."
  fr: "Cette plage contient encore des adresses que vous y avez définies. Supprimez-les ou déplacez-les d'abord : supprimer la plage les laisserait sans rien qui dise à quoi cet espace est destiné."
# 🔴 THE SAME RULE, THE OTHER GESTURE (Guy's decision 2, 2026-09-16). The review's repair made an
# EDIT that abandons an address earn the delete's refusal — and with it the delete's sentence, so an
# operator who had SHRUNK a range was told what deleting it would do. *A true sentence about the
# wrong gesture, which is worse than none.* The rule is one; the sentence is two, because the remedy
# differs: a delete has to be given up, an edit can simply be widened.
ipam.refusal.range_edit_would_abandon:
  en: "The bounds you asked for would leave addresses you defined outside this range. Widen it, or remove or move those addresses first."
  fr: "Les bornes demandées laisseraient hors de cette plage des adresses que vous y avez définies. Élargissez-la, ou supprimez ou déplacez ces adresses d'abord."
ipam.refusal.malformed_subnet:
  en: "Malformed request: the form must carry a subnet in CIDR notation, such as 192.0.2.0/24, a label, and optionally a VLAN."
  fr: "Requête mal formée : le formulaire doit porter un sous-réseau en notation CIDR, par exemple 192.0.2.0/24, une étiquette et, facultativement, un VLAN."
ipam.refusal.not_a_vlan:
  en: "A VLAN is a whole number from 1 to 4094. Leave the field empty if this subnet is not on one."
  fr: "Un VLAN est un nombre entier de 1 à 4094. Laissez le champ vide si ce sous-réseau n'est sur aucun VLAN."

ipam.refusal.malformed_range:
  en: "Malformed request: the form must carry a subnet, a first and a last address, a policy and a label."
  fr: "Requête mal formée : le formulaire doit porter un sous-réseau, une première et une dernière adresse, une politique et une étiquette."
ipam.refusal.malformed_address:
  en: "Malformed request: the form must carry a subnet, an address and a label."
  fr: "Requête mal formée : le formulaire doit porter un sous-réseau, une adresse et une étiquette."
# The four policy words are BINDING (PR #166) and this refusal must not paraphrase them; it names
# the axis and lets the form's own control carry the vocabulary.
ipam.refusal.unknown_policy:
  en: "That is not one of the plan's four policies."
  fr: "Ce n'est pas l'une des quatre politiques du plan."
# ⚠️ Required by Guy's decision of 2026-09-12, refused at the route and NOT in the schema: `label`
# is `NOT NULL` with no non-empty CHECK, so `""` still inserts through raw SQL. A tripwire, never a
# barrier — story 5.12's precedent, stated rather than implied.
# 🔴 It named THE SUBNET and served all three forms (story 14.2b's review). A label with nothing
# visible in it — a zero-width space — is empty too.
ipam.refusal.label_empty:
  en: "A label is required: a plan of numbers with no words is not a plan."
  fr: "Une étiquette est requise : un plan de nombres sans mots n'est pas un plan."
ipam.refusal.label_control:
  en: "That label carries a control or text-direction character, such as a line break: a label is one line of plain text."
  fr: "Cette étiquette contient un caractère de contrôle ou de direction du texte, comme un saut de ligne : une étiquette tient sur une ligne de texte simple."
ipam.refusal.label_too_long:
  en: "That label is too long: 120 characters at most."
  fr: "Cette étiquette est trop longue : 120 caractères au maximum."
# 🔴 ONE PER RECORD: a single sentence told a re-entered ADDRESS that the plan already held that
# SUBNET (story 14.2b's review, measured 409).
# 🔴 Story 14.5 rewrote this sentence rather than adding one beside it. Since `0010` the key it
# rides is `(base, prefix_len, vlan)`, so the CIDR alone no longer decides — and an operator who can
# see that same CIDR under another tab is owed the RULE, not a flat contradiction.
ipam.refusal.already_defined_subnet:
  en: "The plan already holds that address space — an address space is declared once per VLAN."
  fr: "Le plan contient déjà cet espace d'adressage — un espace d'adressage ne se déclare qu'une fois par VLAN."
ipam.refusal.already_defined_range:
  en: "The plan already holds that range."
  fr: "Le plan contient déjà cette plage."
ipam.refusal.already_defined_address:
  en: "That address is already defined in this subnet."
  fr: "Cette adresse est déjà définie dans ce sous-réseau."
ipam.refusal.unknown_subnet:
  en: "That subnet is not in the plan."
  fr: "Ce sous-réseau n'est pas dans le plan."
# 🔑 The rail's two lists (Guy's decision 3, 2026-09-16: lists in the rail rather than controls on
# the grid's cells). A cell is 14 px and already carries a state, a policy and an accessible name;
# hanging two controls on it would have put the gesture where there is no room to say what it does.
ipam.rail.ranges_heading:
  en: "Declared ranges"
  fr: "Plages déclarées"
ipam.rail.addresses_heading:
  en: "Defined addresses"
  fr: "Adresses définies"
ipam.rail.no_ranges:
  en: "No range is declared in this subnet, so nothing says what its space is meant for."
  fr: "Aucune plage n'est déclarée dans ce sous-réseau : rien ne dit à quoi son espace est destiné."
ipam.rail.no_addresses:
  en: "No address is defined in this subnet."
  fr: "Aucune adresse n'est définie dans ce sous-réseau."
# ⚠️ The two controls are LABELLED, never an icon alone: an icon-only button has no accessible name
# unless one is supplied, and this product has already shipped a control that keyboard users could
# not reach at all (story 6b.4b). The record's own description follows in the accessible name.
ipam.rail.edit:
  en: "Correct"
  fr: "Corriger"
ipam.rail.delete:
  en: "Remove"
  fr: "Supprimer"
# Story 14.4b — the binding gesture `release` / « libérer » (prd.md:1002), on a finding's row.
ipam.finding.release:
  en: "Release"
  fr: "Libérer"
# The five corrections' completion sentences. 🔑 They say what BECAME TRUE rather than that a
# statement ran: an operator reading "removed" wants to know the plan no longer claims that space.
# 🔴 **THE CASCADE THIS SENTENCE USED TO PROMISE CAN NEVER HAPPEN**, and the review found the pair.
# `delete_subnet` is refused by a foreign key while ANY range or address still points at the subnet,
# so on success there is by definition nothing left to take with it — *"with everything that
# described it"* described an outcome the schema makes unreachable. Its twin, `subnet_still_holds`,
# justified the refusal by that same impossible cascade; both are corrected rather than softened.
ipam.done.delete_subnet:
  en: "The subnet is gone from the plan."
  fr: "Le sous-réseau ne figure plus dans le plan."
ipam.done.delete_range:
  en: "The range is gone. That space is no longer meant for anything in particular."
  fr: "La plage a été supprimée. Cet espace n'est plus destiné à quoi que ce soit en particulier."
ipam.done.delete_address:
  en: "The address is no longer defined. If something is still using it, the audit will say so."
  fr: "L'adresse n'est plus définie. Si quelque chose l'utilise encore, l'audit le signalera."
ipam.done.edit_range:
  en: "The range now reads as you corrected it."
  fr: "La plage correspond maintenant à votre correction."
ipam.done.edit_address:
  en: "The address now reads as you corrected it."
  fr: "L'adresse correspond maintenant à votre correction."
ipam.done.edit_subnet:
  en: "The subnet now reads as you corrected it."
  fr: "Le sous-réseau correspond maintenant à votre correction."
# 🔴 Story 14.4 SPLITS what one sentence used to serve. `RepositoryError::NotFound` answered
# "that subnet is not in the plan" on EVERY route, so an edit of a range the plan no longer holds
# told the operator their subnet was gone — a sentence that is false and that sends them to look in
# the wrong place. The record the id names is what the sentence must name.
# ⚠️ This paragraph sat ~50 lines above, over the `ipam.rail.*` keys, which it does not describe —
# the review found it. A comment that explains the wrong keys is worse than none: the next reader
# corrects the sentence it is standing on.
ipam.refusal.unknown_range:
  en: "That range is no longer in the plan. Someone may have removed it since this page was drawn — reload and look again."
  fr: "Cette plage n'est plus dans le plan. Quelqu'un l'a peut-être supprimée depuis l'affichage de cette page : rechargez et regardez à nouveau."
ipam.refusal.unknown_address:
  en: "That address is no longer defined in the plan. Someone may have removed it since this page was drawn — reload and look again."
  fr: "Cette adresse n'est plus définie dans le plan. Quelqu'un l'a peut-être supprimée depuis l'affichage de cette page : rechargez et regardez à nouveau."
# 🔴 The OTHER half of the same split, and this one was actively misleading: deleting a subnet that
# still holds ranges raises `ERROR 1451` on a foreign key, which `constraint_refusal` mapped to a
# 404 "no such subnet" — the operator was told the subnet did not exist while looking at it.
ipam.refusal.subnet_still_holds:
  en: "This subnet still holds ranges or addresses you defined. Remove them first — the plan keeps a subnet as long as anything inside it is still declared."
  fr: "Ce sous-réseau contient encore des plages ou des adresses que vous avez définies. Supprimez-les d'abord : le plan conserve un sous-réseau tant que quelque chose y est encore déclaré."
# The five corrections each name THEIR OWN form's fields. One shared sentence was refused: the
# reuse guard asserts the shape sentences are DISTINCT per route, precisely so that a form cannot
# answer with a sentence naming fields it does not carry.
ipam.refusal.malformed_delete_subnet:
  en: "Malformed request: the form must carry the identifier of the subnet to remove."
  fr: "Requête mal formée : le formulaire doit porter l'identifiant du sous-réseau à supprimer."
ipam.refusal.malformed_delete_range:
  en: "Malformed request: the form must carry the identifier of the range to remove."
  fr: "Requête mal formée : le formulaire doit porter l'identifiant de la plage à supprimer."
ipam.refusal.malformed_delete_address:
  en: "Malformed request: the form must carry the identifier of the address to remove."
  fr: "Requête mal formée : le formulaire doit porter l'identifiant de l'adresse à supprimer."
ipam.refusal.malformed_edit_range:
  en: "Malformed request: the form must carry the identifier of the range, a first and a last address, a policy and a label."
  fr: "Requête mal formée : le formulaire doit porter l'identifiant de la plage, une première et une dernière adresse, une politique et une étiquette."
ipam.refusal.malformed_edit_address:
  en: "Malformed request: the form must carry the identifier of the address, the address itself and a label."
  fr: "Requête mal formée : le formulaire doit porter l'identifiant de l'adresse, l'adresse elle-même et une étiquette."
# Story 14.5 — a subnet correction carries its identifier, a label and a VLAN, and NEVER its CIDR:
# the request type has no field for one, so the form cannot offer to move a subnet off its children.
ipam.refusal.malformed_edit_subnet:
  en: "Malformed request: the form must carry the identifier of the subnet, a label, and a VLAN field — which may be left empty for none."
  fr: "Requête mal formée : le formulaire doit porter l'identifiant du sous-réseau, une étiquette et un champ VLAN — qui peut rester vide pour aucun."
# Story 14.4b — the release, the binding gesture `release` / « libérer » (prd.md:1002).
ipam.refusal.malformed_release:
  en: "Malformed request: the form must carry the address to release."
  fr: "Requête mal formée : le formulaire doit porter l'adresse à libérer."
ipam.refusal.release_of_defined:
  en: "This address is defined in the plan, so there is nothing to release. To stop the plan holding it, remove the address."
  fr: "Cette adresse est définie dans le plan : il n'y a rien à libérer. Pour que le plan cesse de la retenir, supprimez l'adresse."
ipam.released_note:
  en: "%{address} is released: the plan forgets what the network showed on it until then. If something answers on it again, it will be listed again."
  fr: "%{address} est libérée : le plan oublie ce que le réseau y a montré jusque-là. Si quelque chose y répond à nouveau, elle sera de nouveau listée."
ipam.done.release:
  en: "The address is released: the plan forgets what the network showed on it until now. If something answers on it again, the audit will say so."
  fr: "L'adresse est libérée : le plan oublie ce que le réseau y a montré jusqu'ici. Si quelque chose y répond à nouveau, l'audit le signalera."
# 🔴 A KEY, where the documenting route still answers an English literal: the review found that
# literal swapped into the page under a French UI. Behind a reverse proxy, `Host` must be forwarded.
# ⚠️ It first said the write "did not come from this opencmdb's own page" — false in the one case an
# operator reads it, behind a proxy rewriting Host, where it DID (the second review). Only the
# mismatch is known, so only the mismatch is said.
ipam.refusal.cross_origin:
  en: "Refused: the origin of this write does not match the host the server received. Behind a reverse proxy, the Host header must be forwarded."
  fr: "Refusé : l'origine de cette écriture ne correspond pas à l'hôte reçu par le serveur. Derrière un proxy inverse, l'en-tête Host doit être transmis."
# 503 and not 409: nothing about the request is wrong. 🔴 Reachable only since this story — the arm
# that produces it was dead code until `classify` was repaired, because nothing in this product
# contended before the plan's routes took a row lock.
#
# 🔴 It promised *"Nothing was written"*, and story 14.2b's review measured a row written after it.
# A timeout during the commit cannot be settled by anyone, so the sentence does not promise either
# way (Guy, 2026-09-15).
ipam.refusal.contention:
  en: "Another change to the plan was in flight, or the write took too long. It may or may not have been saved: reload the plan, and try again if it is missing."
  fr: "Une autre modification du plan était en cours, ou l'écriture a pris trop de temps. Elle a pu être enregistrée ou non : rechargez le plan, et réessayez si elle n'y figure pas."
# 🔴 It promised "Nothing was changed", and a connection lost during COMMIT is a backend error the
# server may have committed (the second review) — the case the contention sentence was rewritten for.
ipam.refusal.backend:
  en: "The write did not go through, or its answer was lost: reload the plan to see what it holds, and see the self-diagnostic if this persists."
  fr: "L'écriture n'est pas passée, ou sa réponse s'est perdue : rechargez le plan pour voir ce qu'il contient, et consultez l'auto-diagnostic si cela persiste."
# The seven `IpamError` refusals, each naming its own rule. ⚠️ Four of them are unreachable from
# the subnet route and reachable from the two this story adds after it; they are written once, here,
# rather than grown one at a time as each route lands.
ipam.refusal.range_outside_subnet:
  en: "That range falls outside its subnet."
  fr: "Cette plage sort de son sous-réseau."
ipam.refusal.range_overlaps:
  en: "That range overlaps one the plan already holds."
  fr: "Cette plage en recouvre une que le plan contient déjà."
ipam.refusal.range_bounds_inverted:
  en: "That range ends before it begins."
  fr: "Cette plage se termine avant de commencer."
ipam.refusal.address_outside_subnet:
  en: "That address falls outside its subnet."
  fr: "Cette adresse sort de son sous-réseau."
# 🔑 `192.0.2.5/24` is refused rather than corrected: containment is arithmetic on the base, and a
# base carrying host bits makes every later answer wrong in a way nothing downstream can detect.
ipam.refusal.base_not_network:
  en: "A subnet is named by its network address: 192.0.2.5/24 is the subnet 192.0.2.0/24."
  fr: "Un sous-réseau se nomme par son adresse de réseau : 192.0.2.5/24, c'est le sous-réseau 192.0.2.0/24."
ipam.refusal.prefix_not_in_family:
  en: "That prefix length cannot belong to an IPv4 subnet: 32 at most."
  fr: "Cette longueur de préfixe ne peut pas appartenir à un sous-réseau IPv4 : 32 au maximum."
ipam.refusal.not_an_address:
  en: "That is not an address the plan can hold."
  fr: "Ce n'est pas une adresse que le plan sache porter."

# ── Sources (story 6b.8) — the REAL capability boundary ──────────────────────
sources.title:
  en: "Sources"
  fr: "Sources"
sources.lede:
  en: "Where the observed state comes from, and what it cannot reach. This section is real: it is read from the connector itself, not from an example."
  fr: "D'où vient l'état observé, et ce qu'il ne peut pas atteindre. Cette section est réelle : elle est lue sur le connecteur lui-même, pas sur un exemple."
sources.perimeter:
  en: "Perimeter"
  fr: "Périmètre"
sources.resolver:
  en: "Name resolver"
  fr: "Résolveur de noms"
sources.resolver_system:
  en: "the system resolver"
  fr: "le résolveur du système"
sources.observes:
  en: "What it observes"
  fr: "Ce qu'elle observe"
sources.cannot_see:
  en: "What it cannot see"
  fr: "Ce qu'elle ne peut pas voir"
sources.unlock:
  en: "Reduced scope is not a fault to repair. What this source cannot see belongs to another one: a lease is the DHCP server's, an uplink is the switch's. Each is a source still to be built, not a setting to turn on."
  fr: "Une portée réduite n'est pas un défaut à réparer. Ce que cette source ne voit pas appartient à une autre : un bail est celui du serveur DHCP, une liaison montante celle du commutateur. Chacune est une source restant à construire, pas un réglage à activer."
sources.mac_needs_l2:
  en: "It reads hardware addresses from the kernel's own neighbour table, which needs no privilege — but it does need real layer-2 presence. Behind an ordinary Docker bridge that table holds the gateway alone, and nothing is ever grouped. Use macvlan, ipvlan or host networking."
  fr: "Elle lit les adresses matérielles dans la table de voisinage du noyau, ce qui ne demande aucun privilège — mais exige une présence de niveau 2 réelle. Derrière un pont Docker ordinaire, cette table ne contient que la passerelle, et plus rien n'est jamais regroupé. Utilisez macvlan, ipvlan ou le réseau de l'hôte."
sources.freshness:
  en: "Last observation"
  fr: "Dernière observation"
sources.never:
  en: "Nothing has been observed yet."
  fr: "Rien n'a encore été observé."
sources.ambiguity:
  en: "That sentence covers four situations the product cannot yet tell apart: never scanned, scanned and nobody answered, a perimeter it refused, and a blank perimeter."
  fr: "Cette phrase recouvre quatre situations que le produit ne sait pas encore distinguer : jamais scanné, scanné sans réponse, un périmètre qu'il a refusé, et un périmètre vide."
sources.incident_axis:
  en: "Whether a source has gone blind is a separate question, and the product does not answer it yet — it arrives with the source-outage work."
  fr: "Savoir si une source est devenue aveugle est une autre question, et le produit n'y répond pas encore — cela arrive avec le travail sur les pannes de source."
sources.no_source:
  en: "No source is configured. Declare a perimeter to scan and this screen will describe what that source can and cannot see."
  fr: "Aucune source n'est configurée. Déclarez un périmètre à scanner et cet écran décrira ce que cette source peut et ne peut pas voir."
kind.mac:
  en: "Hardware address"
  fr: "Adresse matérielle"
kind.mac.meaning:
  en: "identifies an interface across address changes — without it, two addresses cannot be recognised as one machine"
  fr: "identifie une interface à travers les changements d'adresse — sans elle, deux adresses ne peuvent pas être reconnues comme une seule machine"
kind.ipv4:
  en: "IPv4 address"
  fr: "Adresse IPv4"
kind.ipv4.meaning:
  en: "where something answered"
  fr: "là où quelque chose a répondu"
kind.hostname:
  en: "Host name"
  fr: "Nom d'hôte"
kind.hostname.meaning:
  en: "the name a machine gives itself — one of the signals that group several interfaces onto one device"

# ── Identity reach (story 5.14b) ─────────────────────────────────────────────
# ⚠️ A DISTINCT PREFIX, deliberately. `cause.*` below belongs to the RECONCILIATION engine
# (`gap::AbstentionCause`); these belong to the IDENTITY cascade
# (`identity::cascade::IdentityAbstentionCause`). Two vocabularies in one namespace would let a
# future rename silently mislabel a count.
#
# ⚠️ THE UNIT — "sighting" / "constat" — IS TEMPORARY. It is honest today because each scan mints
# fresh `obs_id`s and the pass supersedes nothing across passes, so one machine seen ten times is
# ten rows. Epic 6 gives the population an identity, and on that day these strings change. That is
# a SCHEDULED consequence, not a correction of a mistake.
identity.title:
  en: "Identity"
  fr: "Identité"
identity.placed:
  en: "Sightings placed"
  fr: "Constats rattachés"
identity.not_placed:
  en: "not placed"
  fr: "non rattachés"
identity.because:
  en: "Not placed, because:"
  fr: "Non rattachés, parce que :"
identity.all_placed:
  en: "Every sighting was placed."
  fr: "Chaque constat a été rattaché."
identity.nothing_seen:
  # 🔴 This sentence used to read "Nothing observed yet — run a scan and this fills in." It was
  # true of a virgin install and FALSE the moment a scan landed on a source that cannot identify
  # anything: the page claimed nothing had been observed while forty-eight machines had answered.
  # Since v0.3.0 the engine writes no link for a sighting it can never place, so this branch is
  # reached in BOTH states — and the wording is now true in both, and points at the screen that
  # explains which one you are in.
  en: "No sighting has been placed on an interface yet — see Sources for what this instance can and cannot observe."
  fr: "Aucun constat n'a encore été placé sur une interface — voyez Sources pour ce que cette instance sait et ne sait pas observer."
# The two facts below are DELIBERATELY two strings and must not be fused. The first is a property of
# THIS BUILD that Epic 6 removes; the second is a permanent property of the problem. A reader who
# meets them fused carries the temporary one as permanent.
identity.unit:
  en: "This counts sightings, not devices: one machine seen ten times counts ten. Grouping them is still to come."
  fr: "Ceci compte des constats, pas des appareils : une machine vue dix fois compte dix. Leur regroupement reste à venir."
identity.floor:
  en: "The floor is set by the data, not by the engine: no amount of correctness recovers a signal the source never sent."
  fr: "Le plancher est fixé par les données, pas par le moteur : aucune justesse ne récupère un signal que la source n'a jamais émis."
# Outcomes the engine SETTLED without placing — Guy's case one, "the software decides". Rendered on
# their own line, outside the placed/not-placed pair, because nothing about them awaits the operator.
identity.settled:
  en: "Settled without placing:"
  fr: "Tranchés sans rattachement :"
identity.outcome.no_match:
  en: "A rule forbade the placement"
  fr: "Une règle a interdit le rattachement"
identity.outcome.unrecognised:
  en: "Unrecognised outcome (%{token})"
  fr: "Issue non reconnue (%{token})"
identity.cause.absence_of_proof:
  en: "No proof of identity"
  fr: "Aucune preuve d'identité"
identity.cause.ambiguous:
  en: "Several possible identities"
  fr: "Plusieurs identités possibles"
# Reached when the store holds a token no enum variant names — see `page::identity_cause_line`.
identity.cause.unrecognised:
  en: "Unrecognised cause (%{token})"
  fr: "Cause non reconnue (%{token})"
# ── Why an identity cause carries no documenting gesture (story 6.4, AC2) ────
# 🔴 SAYING NOTHING IS NOT THE SAME AS SAYING NO. A count with no control beside it reads as a
# feature someone forgot; these three sentences are the section answering the operator's question
# instead of leaving it. The documenting gesture belongs to `undeclared` — *observed, and no
# declared record claims it* — and it lives on the triage queue's `Nouveau` row, where that
# population already is.
#
# ⚠️ THREE keys where the story budgeted two, and the THIRD is forced by the type rather than
# chosen: `identity_cause_line` is total over the store's tokens, and its tolerant arm renders a
# line like any other. A cause the product cannot name is still a cause the operator is looking at.
#
# ⚠️ The SETTLED lines get none of these, and that is a decision: they are Guy's case ONE — the
# software decided — and nothing about them awaits the operator, which `identity.settled` already
# says. AC2 speaks of a CAUSE, and the code distinguishes a cause from an outcome.
identity.no_gesture.absence_of_proof:
  en: "Nothing to document here: what is missing is a source that can prove identity, not a record to write. The Sources screen says what this one cannot read."
  fr: "Rien à documenter ici : ce qui manque est une source capable de prouver l'identité, pas une fiche à écrire. L'écran Sources dit ce que celle-ci ne peut pas lire."
# ⚠️ The clause *"and choosing among the candidates is still to come"* stood here until story
# 6.4's code review and was refuted by the doctrine sentence in `identity_view.rs`, in the same
# commit: *announcing an absent gesture is a promise; this section stays descriptive until the
# gesture is there* (Guy, 2026-08-12). What is left is what is TRUE of the state itself.
identity.no_gesture.ambiguous:
  en: "Nothing to document here: this is a doubt to lift, not an entity to create."
  fr: "Rien à documenter ici : c'est un doute à lever, pas une entité à créer."
identity.no_gesture.unrecognised:
  en: "Nothing to document here: the product does not recognise this cause, so it offers nothing for it."
  fr: "Rien à documenter ici : le produit ne reconnaît pas cette cause et n'offre donc rien pour elle."


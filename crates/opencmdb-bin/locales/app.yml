# ── The action bar: five controls, ONE of them live (story 6b.4b, then 6.4) ────
# 🔴 NO STORY NUMBER in any of these values. *"Arrives in 6.4"* would turn the label into a calendar,
# therefore a promise — what story 5.14b refused. The owner lives in the type, never on the screen,
# and a guard asserts that these values carry no digit.
gesture.badge:
  en: "Not yet"
  fr: "À venir"
# 🔴 **STORY 6.4 MADE THE OLD SENTENCE FALSE AND ONLY A LOOK COULD SAY SO.** It read *"This
# gesture is not built yet."* under a bar in which every control was planned — true until the
# documenting gesture went live, and from that moment a group-level line contradicting the
# loudest control on the screen. ⚠️ It is announced per control through `aria-describedby`, so
# it was right in the ear and wrong on the page, which is why no assertion moved.
#
# 🔑 The badge is INTERPOLATED rather than quoted, so the sentence and the mark it names cannot
# drift apart: change `gesture.badge` and this follows it in both languages.
# 🔴 BUILT AND SWITCHED OFF — a THIRD state, and story 6.4's code review is what forced it.
# With `POST /document-all` unmounted the documenting control rendered as *planned*, so the product
# said "not built yet" about the gesture it had just built, on the default configuration. Hiding the
# control was refused (Guy's premise (2) of 2026-08-13: show and label rather than hide) — a fresh
# install would never learn the product can document at all.
#
# 🔑 The switch is INTERPOLATED from `main::DOCUMENT_ENABLED_ENV`, the same constant the boot reads,
# so the sentence on screen cannot name a variable the binary does not.
# ── The documenting gesture's ANSWER (story 6.4's code review, 2026-08-26) ──────────────────
# 🔴 Until this pass the operator read `format!("documented {} field(s) as entity {}")` — a Rust
# literal, so: ENGLISH under a French UI, the parenthetical plural story 6b.10 fixed AS A CLASS on
# this very screen, and a raw UUID story 6b.4's review had already removed from this pane. Three
# defects this project had each paid for once, returning through a body no locale guard walks:
# `no_value_fobs_the_reader_off_with_a_parenthetical_plural` reads `app.yml` and cannot see a
# `format!` in `document.rs`. Epic 5's dominant class, one file over.
#
# 🔑 The entity id is GONE from what the operator reads. It named nothing they can act on; the
# effect they can check is that the question left the queue, and that is what the sentence says.
document.done_one:
  en: "Documented: %{n} field."
  fr: "Documenté : %{n} champ."
document.done_other:
  en: "Documented: %{n} fields."
  fr: "Documenté : %{n} champs."
document.unknown_subject:
  en: "Unknown subject: there is nothing here to document."
  fr: "Sujet inconnu : il n'y a rien à documenter ici."
document.already_documented:
  en: "Already documented: this sighting's fields are declared."
  fr: "Déjà documenté : les champs de ce constat sont déclarés."
document.nothing_to_document:
  en: "Nothing to document: this sighting carries no field the product can declare."
  fr: "Rien à documenter : ce constat ne porte aucun champ que le produit sache déclarer."
document.malformed:
  en: "Malformed request: the form must carry a subject naming an observation."
  fr: "Requête mal formée : le formulaire doit porter un sujet nommant une observation."
document.backend:
  en: "The write did not go through. Nothing was changed; see the self-diagnostic if it persists."
  fr: "L'écriture n'est pas passée. Rien n'a été modifié ; consultez l'auto-diagnostic si cela persiste."
# The confirmation carried across the redirect, rendered by `/triage` itself — see `TriageQuery`.
triage.documented_one:
  en: "%{n} field documented. The question has left the queue."
  fr: "%{n} champ documenté. La question a quitté la file."
triage.documented_other:
  en: "%{n} fields documented. The question has left the queue."
  fr: "%{n} champs documentés. La question a quitté la file."
gesture.badge_off:
  en: "Not enabled"
  fr: "Non activé"
gesture.not_enabled:
  en: "This gesture is built and switched off on this instance: set %{switch} to enable it."
  fr: "Ce geste est construit et non activé sur cette instance : définissez %{switch} pour l'activer."
gesture.not_built:
  # 🔴 This sentence used to read "The gestures marked %{badge} are still to come." — which answers
  # the badge with the badge. Guy asked what « À venir » means, and the honest answer was that the
  # product never said what those gestures WOULD DO. A marker may be short; the sentence beside it
  # is where the meaning has to live.
  #
  # ⚠️ The `%{badge}` interpolation is KEPT, and a test is why. The first rewrite dropped it for a
  # plain sentence — and `the_rendered_bar_says_the_gesture_is_not_built` reds on exactly that: the
  # sentence names the badge it scopes itself to, INTERPOLATED, so the two cannot drift apart. The
  # improvement was to say what the gestures DO; losing the coupling was not part of it.
  en: "The gestures marked %{badge} are still to come: resolve an ambiguity, accept a gap as permanent, snooze a question, attach a sighting to a device."
  fr: "Les gestes marqués %{badge} sont à venir : résoudre une ambiguïté, accepter un écart durable, mettre une question en veille, rattacher un constat à un appareil."
# 🔴 `gesture.document`, NOT `gesture.merge`, and the English value is `Document` — Guy's
# arbitration 1 of 2026-08-21, story 6b.10. The binding glossary retires `merge` IN ENGLISH by
# name (`prd.md:1037`, `ux-design-specification.md:1386`): *"it names the forbidden operation —
# the founding pillar is linked, never merged"*. The FRENCH « Merger » is the FIXED translation
# of `document` and carries no such claim, so it is unchanged. The key name is in scope too: the
# glossary's first column is "EN (docs, API, code)".
gesture.document:
  # 🔴 **"Ajouter" / "Add" since v0.3.1, and the reason is what the action DOES.**
  #
  # It read "Document" / « Merger » — a pair `prd.md:888` fixed deliberately. Guy looked at his own
  # product on his own network and the word did not tell him what the button does. Two measurements
  # settled it:
  #
  #   * « Merger » is an anglicism; the French is « Fusionner ». But
  #   * the action CANNOT fuse anything. There is no `ON DUPLICATE KEY UPDATE` anywhere in the
  #     adapter, the primary key is `(entity_id, attr_key)`, and a second write for one field errors
  #     1062. **The engine can only ever ADD a declared value, never replace one** — NFR5, and it is
  #     what protects an operator's testimony from a machine.
  #
  # So "merge" was retired in English for a reason that holds in French too: *the operation the word
  # names does not exist*. The verb that does name it is the plain one. 🔑 And it is the same verb for
  # the future per-field gesture (FR13(b)): adding ONE field that has no declared value is still
  # adding.
  #
  # ⚠️ NOT "Adopt" / « Adopter », though the database says `origin='adopted'`: that word is right
  # about provenance and wrong about what the operator is doing, which is putting a machine's
  # observation into their own record.
  en: "Add"
  fr: "Ajouter"
gesture.resolve:
  en: "Resolve"
  fr: "Résoudre"
gesture.accept_gap:
  en: "Accept the gap"
  fr: "Accepter l'écart"
gesture.snooze:
  en: "Snooze"
  fr: "Mettre en veille"
gesture.attach:
  en: "Attach"
  fr: "Rattacher"
gesture.exclude:
  en: "Exclude"
  fr: "Exclure"


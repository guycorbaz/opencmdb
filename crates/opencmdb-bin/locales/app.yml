  en: "What it observes"
  fr: "Ce qu'elle observe"
sources.cannot_see:
  en: "What it cannot see"
  fr: "Ce qu'elle ne peut pas voir"
sources.unlock:
  en: "Reduced scope is not a fault to repair. It is a capability to unlock: granted the raw-socket privilege, this source would read hardware addresses."
  fr: "Une portée réduite n'est pas un défaut à réparer. C'est une capacité à débloquer : si on lui accordait le privilège de socket brut, cette source lirait les adresses matérielles."

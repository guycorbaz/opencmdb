# xtask — the dev-tool runner. A workspace member and a dependency of NOBODY (D56).
# It carries `cargo xtask ci` (all gates, in Rust, not YAML — D56/D65). ⚠️ It does NOT yet carry
# `cargo xtask css`
# (the pinned Tailwind CLI, never build.rs — D55) or `cargo xtask recapture` (D56): both are
# planned and neither is implemented. Verified 2026-08-18; `main.rs` dispatches `ci` alone.
# D63: a secret reaches a dev tool on STDIN only.
[package]
name = "xtask"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.103"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
# The fixture MANIFEST is TOML (D56). Already in the workspace tree; no new supply chain.
toml = "0.8.23"
walkdir = "2.5.0"
# The locale file is YAML and the `copy-vocabulary` gate is a DENYLIST, so a value it fails to
# parse reads GREEN — a hole, not a false alarm. Story 6b.10's validation built both parses and
# measured a naive line split missing SEVEN of twelve legal shapes (block scalars `|`/`>`/`|-`,
# a flow mapping, a four-space indent, a plain multi-line continuation, a nested key). ⚠️ Already
# in `Cargo.lock` via `config` → `opencmdb-bin`, so this adds ONE line to the lockfile and NO
# crate to the supply chain — measured with `cargo tree -i yaml-rust2` before it was taken.
yaml-rust2 = "0.11.0"

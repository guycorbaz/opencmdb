# opencmdb CI — a THIN runner (D56). All gate logic lives in `cargo xtask ci`, in Rust,
# never here. This YAML only calls Rust: the same commands a developer runs locally, so
# dev == CI. No greps, no bespoke gate logic. MariaDB service + cargo-deny arrive in
# Story 1.5; the pinned MSRV toolchain + Renovate in Story 1.6.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref (a new push obsoletes the previous one).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # sqlx's `mysql` feature speaks the MariaDB wire protocol (D64) — this is the driver
      # for the one engine, not a second backend. DB-touching tests (a later story) connect
      # here with zero extra wiring; today the service is provisioned but idle.
      DATABASE_URL: mysql://root:opencmdb@127.0.0.1:3306/opencmdb_test
    services:
      mariadb:
        # The EXACT DSM 7 package version (D64) — pinned so dev == CI == prod. Never `10.11`
        # or `latest`. MariaDB is the ONLY supported engine; SQLite and MySQL are OUT.
        image: mariadb:10.11.11
        env:
          MARIADB_ROOT_PASSWORD: opencmdb
          MARIADB_DATABASE: opencmdb_test
        ports:
          - 3306:3306
        # Wait until the server accepts connections and InnoDB is up (the image ships
        # `healthcheck.sh`), so the job only proceeds once the DB is reachable.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5

      # Reads rust-toolchain.toml and installs exactly that channel + its components
      # (clippy, rustfmt), and sets up the build cache — so CI == the pinned MSRV.
      - name: Set up Rust (pinned via rust-toolchain.toml) + build cache
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Project gates (cargo xtask ci)
        run: cargo xtask ci

      - name: Dependency audit (cargo-deny)
        run: cargo deny check advisories licenses

      - name: Tests
        run: cargo test --workspace --locked

      # 🔴 THE ONE STEP IN THIS FILE THAT IS NOT A CALL INTO RUST, AND THE EXCEPTION IS
      # DELIBERATE. This runner's own header says all gate logic lives in `cargo xtask ci`,
      # in Rust, never here — and the accessibility gate cannot obey it: axe-core measures
      # the RENDERED, COMPUTED page (contrast against the ground that actually paints, ARIA
      # against the role a browser actually resolves), and `cargo xtask ci` has no browser.
      # A Rust re-implementation would be a second, weaker axe. Story 6b.11, registered.
      #
      # ⚠️ It is also the first step that BOOTS THE PRODUCT. Everything above compiles and
      # tests; this one runs the binary and talks to it over HTTP.
      #
      # `ubuntu-latest` ships Node and Chrome; `puppeteer-core` uses the system browser and
      # downloads none. ⚠️ If that stops being true, **once `node` is running the gate** the
      # step fails with exit 2 — *the gate could not run* — and not with exit 1, which is
      # reserved for a real regression. 🔑 **That promise is narrower than it read until story
      # 6b.11's arbitration 1**, and the narrowing is measured: a missing `puppeteer-core`
      # answered **1** (a static `import` resolves before any `try` of the gate's own exists —
      # it is a dynamic import now), and everything the SHELL does before `node` keeps its own
      # codes: `npm ci` exits npm's, the readiness `curl` exits 22, a missing Node exits 127.
      #
      # 🔴 **THE STORE IS SEEDED, and until story 6b.11 it was not.** The gate walked a
      # `/triage` carrying 0 queue rows, 0 gesture controls and 0 panes — measured — so the
      # whole surface 6b.11 touched was outside every CI run, forever, and the story's own
      # defect replanted exited **0**. `AXE_REQUIRE_QUEUE=1` turns an empty queue into *the
      # gate could not run* rather than a pass, so a seed that silently stops working cannot
      # look like coverage.
      - name: Accessibility gate (axe-core over every screen the navigation offers)
        env:
          DATABASE_URL: mysql://root:opencmdb@127.0.0.1:3306/opencmdb_test
          OPENCMDB_BASIC_USER: ci
          OPENCMDB_BASIC_PASSWORD: ci-not-a-secret
          # 🔴 **STORY 6.4: WITHOUT THIS THE PRODUCT'S ONLY LIVE GESTURE IS ON NO PAGE EITHER
          # BROWSER GATE WALKS.** `POST /document-all` is registered only under this switch
          # (story 6.1, off by default and deliberately so), and the page renders the control
          # only where the route is mounted — so a server booted without it serves a triage
          # screen with nothing to press, and both gates would report a clean product over a
          # gesture they never saw. ⚠️ It is set HERE and not in the image: this is the gate's
          # server, not a deployment.
          OPENCMDB_DOCUMENT_ENABLED: "1"
        run: |
          set -euo pipefail
          cargo build --workspace --locked
          ./target/debug/opencmdb &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          # ⚠️ `--max-time` is not decoration. Without it this loop reads as a 30-second wait
          # and is bounded at ~15.5 MINUTES against a store that accepts TCP and does not
          # answer (measured: `http=503 time=30.002716`) — which is the one path a readiness
          # loop exists for. The normal failure, a port not yet bound, is instant either way.
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/healthz
          # AFTER the boot, because the tables are the binary's own migrations.
          #
          # 🔴 **`a11y/seed.sql`, NOT `docker/seed-example.sql`, and the difference is one row
          # that decides whether the keyboard gate can run at all.** The shipped demo seed
          # renders exactly ONE queue row — measured on a virgin database, 0 before it and 1
          # after — while `kbd-probe.mjs` needs at least two: a single row cannot witness an
          # arrow STEP and gives the two end-of-list controls nothing to be at either end of.
          # ⚠️ **The run that first passed here was green on RESIDUE**: the `Tests` step above
          # uses the same database, and what it happened to leave behind carried the queue over
          # the floor. Nothing guaranteed that. The harness's own seed TRUNCATES first, so the
          # gates measure a state this repository can reproduce rather than one the pipeline
          # accumulated.
          mysql -h 127.0.0.1 -P 3306 -u root -popencmdb opencmdb_test < a11y/seed.sql
          npm --prefix a11y ci
          OPENCMDB_BASIC_USER="$OPENCMDB_BASIC_USER" \
            OPENCMDB_BASIC_PASSWORD="$OPENCMDB_BASIC_PASSWORD" \
            AXE_REQUIRE_QUEUE=1 \
            AXE_REQUIRE_GESTURE=1 \
            node a11y/axe-gate.mjs
          # 🔴 **THE KEYBOARD LAYER'S ONLY CARRIER, and until story 6b.11's repair pass it
          # ran nowhere.** `crates/opencmdb-bin/assets/app.js` could be EMPTIED with 490
          # tests, nine gates and the axe gate all green — measured by two review layers
          # independently. axe has no rule for any of what that file does, so this is not the
          # gate above with more routes: it presses keys and reads the DOM back.
          #
          # 🔴 **IT WRITES, SINCE STORY 6.4, AND THAT IS WHY IT STAYS LAST.** Its final block
          # presses the documenting gesture for real: the route answers 201 and the undeclared
          # sighting the seed plants becomes a documented entity. A second run against the same
          # store answers 409, htmx swaps nothing on a non-2xx, and the focus checks would then
          # red over a working product — so the probe reads the status off the wire and reports
          # that as *the gate could not run*, never as a regression. Re-seed before it if this
          # step is ever reordered.
          node a11y/kbd-probe.mjs

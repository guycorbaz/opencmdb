  #
  # 5.4b INSERTED 2026-07-29 with Guy, at 5.4's contexting and before any Epic 5 engine code existed
  # — the same shape as 5.2b's insertion, and for the same reason: the thing being split out is the
  # one whose correctness has to be the SUBJECT of a story, not a subsection of one. It owns

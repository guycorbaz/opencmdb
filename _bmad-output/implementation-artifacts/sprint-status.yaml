  #
  # 5.4b CONTEXTED + VALIDATED 2026-07-29 → ready-for-dev.
  # ⚠️ PREREQUISITE: PR #52 must be MERGED before dev-story. This is the first Epic 5 story contexted
  # while its predecessor's PR was still open (the four before it were each merged first); every
  # `cascade.rs` line number in the story was measured on `3d63544`, the post-code-review tree, which
  # is what master holds once #52 merges. The deviation is recorded at the top of the story, not
  # smoothed.
  # It answers the THREE findings story 5.4's code review handed forward on purpose: what `decide`
  # RETURNS, who owns the conclusion↔verdict_vector invariant, and the pre-existing `f64` token
  # sitting in the very subtree this story's gate greps.
  # THE DESIGN DECISION: `decide(Vec<RuleVerdict>, RulesetVersion) -> Decision` returns a Decision,
  # NOT a bare Conclusion — so the returned verdict_vector IS the input, and "a Match with an empty
  # vector" / "a conclusion naming a rule absent from its own vector" become unrepresentable THROUGH
  # THE FUNCTION rather than merely unenforced. That is what makes the invariant testable at all.
  # VALIDATED by two fresh-context agents (fact-check + gap-hunt): 9 HIGH + 12 MEDIUM/LOW applied.
  # FOUR of them changed the DESIGN and every one was MEASURED, not argued:
  #   · the arms are now bound to a `match` on the presence tuple — the gap-hunt agent COMPILED all
  #     three shapes the story permitted and found that with an `if`-chain, deleting the arbitration
  #     arm "compiles and changes 0 of 16 input classes". M2 would have been a silent no-op and the
  #     story's central claim would have shipped unproven;
  #   · the permutation test was VACUOUS as written: three mixed verdicts conclude `Abstained`, which
  #     names no rule, so no tiebreak can change it — and the 32-subset walk gives AC4 ZERO coverage
  #     (one RuleVerdict per verdict means `min()` over a singleton). It now requires three verdicts
  #     of the same rule-naming kind with lex order ≠ vector order;
  #   · an implementation taking `min()` over the WHOLE vector passed every specified test while
  #     returning `NoMatch { rule }` naming the rule that argued FOR the merge. Closed by a named
  #     test and by requiring the oracle to return a full Conclusion (assert_eq, never matches!);
  #   · the float gate was BUILT AND RUN: the specified word-boundary match misses `0.85f64` and
  #     `let confidence = 0.85;` — the likeliest shapes a weight takes — and reds on a block comment,
  #     a FALSE POSITIVE, the one direction the draft said could not happen.
  # BOOKKEEPING corrected before dev rather than after: the register set is EIGHT entries across FOUR
  # sections (not six in one — two `NoMatch` entries in the 4.6a/4.7a sections still say "nothing
  # decides which side an input falls on", which `decide` falsifies); ELEVEN doc blocks are falsified,
  # not five; and the story cited `cascade.rs:42` for the f64 token when it is `:52` — a number
  # inherited from the register without re-measuring, which is the story's own inherited lesson #1
  # committed by the story that quotes it. Caught before dev this time.
  5-4b-verdict-algebra-and-float-gate: ready-for-dev
